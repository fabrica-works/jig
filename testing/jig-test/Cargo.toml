[package]
name = "jig-test"
description = "The reference one-process service and agent command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-test-service.workspace = true
jig-protocol-config.workspace = true
jig-domain-host.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
skein-tls.workspace = true
skein-oauth-accounts.workspace = true
smith-agent-shell.workspace = true
smith-local-service.workspace = true
smith-host-protocol.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[dev-dependencies]
jig-client-protocol-world = { path = "../../tests/client-protocol" }
jig-channel-world = { path = "../../tests/channel" }
jig-shell-native = { path = "../../crates/jig-shell-native" }
skein-tls-world.workspace = true
skein-world.workspace = true
skein-fake-peers.workspace = true
skein-fake-llm-domain.workspace = true
skein-llm.workspace = true
smith-agent-process-world.workspace = true
serde_json = "1.0"
tempfile = "3"

[[test]]
name = "process"
path = "tests/process.rs"
