[package]
name = "jig-client-test-shell-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
jig-client.workspace = true
jig-client-test-domain.workspace = true
jig-client-test-view.workspace = true
jig-client-test-protocol-wire.workspace = true
jig-client-view.workspace = true
jig-client-protocol-http.workspace = true
jig-client-protocol-link.workspace = true
jig-client-shell-web.workspace = true
skein-lib.workspace = true
skein-ui.workspace = true
skein-ui-web.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Location", "HtmlElement"] }
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
