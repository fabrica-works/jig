[package]
name = "jig-conformance"
description = "Application conformance harness and independent referee"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-fake-store.workspace = true
jig-test-system.workspace = true
skein-world.workspace = true
skein-lib.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# The scripted world is ordinary Rust, outside the strict step-code subset.
disallowed_types = "allow"
disallowed_methods = "allow"
disallowed_macros = "allow"
