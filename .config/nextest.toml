# Test-time caps doubled provisionally at the user's request, 10-22.
# Slow periods are doubled; terminate-after counts stay fixed, so termination
# deadlines double as well.
# The three test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones, within 30 seconds; and the fuzzy one, the test
# binaries named fuzzy_* beside each world's focused tests, within 2 minutes. A
# suite past its budget fails, naming the tests it stopped; a test past its
# slow period is flagged SLOW as it runs.

[profile.default]
# The gate reads live configurations; the live tests themselves need a person.
default-filter = "not binary(/^fuzzy_/) & (not binary(/^(process|live)$/) | (binary(=live) & test(=the_live_configurations_are_ones_jig_test_reads))) & not binary(/^browser_/) & not binary(/^qa_/)"
global-timeout = "30s"
slow-timeout = { period = "1000ms" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) & not binary(/^(process|live)$/) & not binary(/^browser_/) & not binary(/^qa_/)"
global-timeout = "120s"
slow-timeout = { period = "10s" }

# The QA passes' tests (skein's docs/foundation/owners.md, 4.6): the binaries named qa_*, which the gate builds and does not run.
[profile.qa]
default-filter = "binary(/^qa_/)"
global-timeout = "120s"
slow-timeout = { period = "10s" }

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "2h"
slow-timeout = { period = "120s" }

[profile.process]
default-filter = "binary(=process)"
global-timeout = "4m"
test-threads = 1

[profile.live]
default-filter = "binary(=live)"
global-timeout = "24m"
slow-timeout = { period = "10m", terminate-after = 1 }
test-threads = 1
retries = 0

# The driver's five-minute sign-in, then a bounded answer and confirmed
# sign-out, within the test's own twenty minutes: this only backs that bound up.
[[profile.live.overrides]]
filter = "test(=a_person_signs_in_to_chatgpt_and_a_real_model_answers)"
slow-timeout = { period = "22m", terminate-after = 1 }

# Chromium against jig-test, within two minutes.
[profile.browser]
default-filter = "package(jig-client-browser-world) & binary(/^browser_/)"
global-timeout = "120s"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1
