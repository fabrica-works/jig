# The three test suites (docs/development/workflow.md): the focused one, every
# test but the fuzzy ones, within 15 seconds; and the fuzzy one, the test
# binaries named fuzzy_* beside each world's focused tests, within 1 minute. A
# suite past its budget fails, naming the tests it stopped; a test past its
# slow period is flagged SLOW as it runs.

[profile.default]
default-filter = "not binary(/^fuzzy_/) & not binary(/^(process|live)$/) & not binary(/^browser_/)"
global-timeout = "15s"
slow-timeout = { period = "500ms" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) & not binary(/^(process|live)$/) & not binary(/^browser_/)"
global-timeout = "60s"
slow-timeout = { period = "5s" }

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "1h"
slow-timeout = { period = "60s" }

[profile.process]
default-filter = "binary(=process)"
global-timeout = "2m"
test-threads = 1

[profile.live]
default-filter = "binary(=live)"
global-timeout = "12m"
slow-timeout = { period = "5m", terminate-after = 1 }
test-threads = 1
retries = 0

# The driver's five-minute sign-in, then a bounded answer and confirmed
# sign-out, within the test's own ten minutes: this only backs that bound up.
[[profile.live.overrides]]
filter = "test(=a_person_signs_in_to_chatgpt_and_a_real_model_answers)"
slow-timeout = { period = "11m", terminate-after = 1 }

# Chromium against jig-test, within one minute.
[profile.browser]
default-filter = "package(jig-client-browser-world) & binary(/^browser_/)"
global-timeout = "60s"
slow-timeout = { period = "20s", terminate-after = 3 }
test-threads = 1
