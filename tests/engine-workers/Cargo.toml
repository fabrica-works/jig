[package]
name = "jig-engine-workers-world"
description = "Engine worker channels against scripted byte peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jig-domain-host.workspace = true
jig-protocol-engine-workers.workspace = true
jig-protocol-worker-wire.workspace = true
skein-channel.workspace = true
skein-fake-channel.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the world asserts its invariants by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the translation
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
