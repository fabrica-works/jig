[package]
name = "jig-engine-clients-world"
description = "Native client exchanges against scripted HTTP peers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
jig-test-service.workspace = true
skein-world.workspace = true
jig-protocol-engine-clients.workspace = true
jig-protocol-engine-clients-http.workspace = true
jig-client-protocol-wire.workspace = true
jig-domain-core.workspace = true
jig-domain-authority.workspace = true
jig-domain-fleet.workspace = true
jig-protocol-config.workspace = true
jig-domain-people.workspace = true
jig-domain-views.workspace = true
jig-client-test-records = { path = "../../testing/jig-client-test-records" }
skein-http.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
[dev-dependencies]
jig-core-world = { path = "../core" }
jig-domain-tasks.workspace = true
jig-test-domain = { path = "../../testing/jig-test-domain" }
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
